<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deals desk{% endblock %} · BrandNest</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: light dark; --line: #d8d2d4; --muted: #6b6169; --accent: #7b1e3a; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; }
    header { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex;
             gap: 20px; align-items: baseline; }
    header a { color: inherit; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    h1 { font-size: 18px; margin: 0 20px 0 0; color: var(--accent); }
    main { padding: 24px; max-width: 1100px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
    .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); }
    .status.verified, .status.live { border-color: var(--accent); color: var(--accent); }
    .status.rejected, .status.expired { color: var(--muted); }
    .status.accepted { border-color: var(--accent); color: var(--accent); }
    /* Big enough to judge a deal from, small enough to keep the queue scannable. */
    .thumb { width: 90px; max-height: 130px; object-fit: cover; border: 1px solid var(--line); }
    form.inline { display: inline; }
    button { font: inherit; padding: 4px 10px; cursor: pointer; border: 1px solid var(--line);
             background: transparent; border-radius: 6px; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .empty { color: var(--muted); padding: 12px 0; }
    label { display: block; margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
    input, select { font: inherit; padding: 6px 8px; min-width: 260px; }
    .checks label { display: inline-block; margin-right: 14px; color: inherit; }
    .checks input { min-width: 0; }
    .actions { margin-top: 24px; }
    .actions button { padding: 8px 18px; }
  </style>
</head>
<body>
  <header>
    <h1>BrandNest deals desk</h1>
    <a href="/admin">Queue</a>
    <a href="/admin/offers">Bank offers</a>
    <a href="/admin/sales">Sale events</a>
    <a href="/admin/reports">Community reports</a>
    <a href="/admin/brands">Brand checkouts</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
